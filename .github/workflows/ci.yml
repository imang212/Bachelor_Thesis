name: CI Tests & Kubernetes CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core dependencies for unit tests
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv shapely pytest

      - name: Run unit tests
        run: |
          PYTHONPATH=. python -m pytest tests/

      - name: Validate Docker Compose files
        run: |
          cp .env.example .env
          docker compose -f pc_src/docker-compose.yml --env-file .env config > /dev/null
          docker compose -f rpi_src/docker/docker-compose.yml --env-file .env config > /dev/null

  deploy-k8s:
    needs: test-and-validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes cluster (if KUBECONFIG secret is configured)
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "KUBECONFIG secret not set — skipping live cluster rollout."
            exit 0
          fi
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          kubectl apply -f pc_src/k8s/deployment.yaml
